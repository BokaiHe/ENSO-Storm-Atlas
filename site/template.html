<style>
/* Layout: product-page rhythm. One centered 1080px column, generous section spacing, full-width map plates within glass section surfaces, quiet gray cards. Color is reserved for data: warm = El Niño, cool = La Niña. Switchable dark and light palettes. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --card: #141416;
  --card-2: #1c1c1e;
  --hair: rgba(255,255,255,.08);
  --ink: #f5f5f7;
  --ink-2: #a1a1a6;
  --muted: #6e6e73;
  --nino: #ff7a50;
  --nina: #5ab0ff;
  --neutral: #8e8e93;
  --land: #222225;
  --coast: #3a3a3e;
  --sea-1: #0b0b0c;
  --sea-2: #050505;
  --land-dot: #1c1c1e;
  --line: rgba(255,255,255,.07);
  --line-2: rgba(255,255,255,.16);
  --panel: #141416;
  --c0: #f2f2f7; --c1: #ffd60a; --c2: #ff9f0a; --c3: #ff6b3d; --c4: #ff375f; --c5: #bf5af2;
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Noto Sans SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
}
/* Shared surface colors also feed the SVG and canvas renderers. */
:root { --surface-rgb: 255,255,255; --on-ink: #000; --hover: #2c2c2e; --selected: #3a3a3c; --halo: rgba(0,0,0,.8); --grid: rgba(255,255,255,.035); }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f5f6f8; --card: #ffffff; --card-2: #e9ecf1;
  --hair: rgba(25,35,50,.12); --ink: #19212c; --ink-2: #505e6e; --muted: #626f7f;
  --nino: #b94320; --nina: #1768ae; --neutral: #6f7886;
  --land: #e1e7ed; --coast: #9ba9b7; --land-dot: #a8b4c1;
  --sea-1: #f9fbfd; --sea-2: #edf2f7;
  --line: rgba(25,35,50,.09); --line-2: rgba(25,35,50,.24); --panel: #fff;
  --surface-rgb: 25,35,50; --on-ink: #fff; --hover: #dde3eb; --selected: #fff;
  --halo: rgba(255,255,255,.9); --grid: rgba(25,35,50,.07); --c0: #a8b3c3;
}
* { box-sizing: border-box; }

.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 22px; padding-block: 0 96px; }

.mono { font-variant-numeric: tabular-nums; }
.k-nino { color: var(--nino); } .k-nina { color: var(--nina); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; align-items: center; gap: 10px 20px; flex-wrap: wrap; padding: 10px 22px; margin-inline: -22px;
  background: rgba(0,0,0,.72); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: 1px solid var(--hair); }
.brand { font-weight: 600; font-size: 17px; white-space: nowrap; }

.seg { display: inline-flex; align-items: center; gap: 8px; }

/* One glass surface per main section; the overlay leaves chart widths and hit targets intact. */
section {
  --section-top: 128px;

  --glass-gutter: 32px;
  position: relative;
  isolation: isolate;
  padding-block: var(--section-top) 0;
}
section::before {
  content: "";

  z-index: -1;
  pointer-events: none;
  inset: calc(var(--section-top) - var(--glass-inset)) calc(-1 * var(--glass-gutter)) calc(-1 * var(--glass-inset));
  border-radius: 32px;
  border: 1px solid rgba(255,255,255,.24);
  background: linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.015) 45%, rgba(255,255,255,.055)), rgba(26,31,41,.22);
  box-shadow: inset 0 1.5px 1px rgba(255,255,255,.24), inset 0 -1px 1px rgba(255,255,255,.08), 0 20px 60px rgba(0,0,0,.24);
  -webkit-backdrop-filter: blur(28px) saturate(150%);
  backdrop-filter: blur(28px) saturate(150%);
}
section.hero { --section-top: 88px; }
@media (max-width: 1199px) { section { --glass-gutter: 14px; } }
@media (max-width: 600px) {
  section { --glass-inset: 24px; --glass-gutter: 10px; }
  section::before { border-radius: 24px; }
}
@media (prefers-reduced-transparency: reduce) {
  section::before { background: #191a1e; -webkit-backdrop-filter: none; backdrop-filter: none; }
}

    concl: (lon, lat, mix, within, n, auc) => `<span class="reading-block">Using complete tracks (1966–2025, all named storms), the moment method gives a clear picture. In El Niño seasons the cloud of storm centroids sits <strong>${lon}° further east and ${lat}° further north</strong>. The eastward shift is almost entirely a change in which tracks occur: changes in the shares of <strong>all four track types together account for ${mix}°</strong> of it, including a lower share of Gulf and Caribbean tracks. Type mix remains the main component for every number of track types tested. </span><span class="reading-block">The northward shift happens inside the track types: the same kinds of tracks run <strong>about ${within}° further north</strong>, which holds for four or more types and after removing the long-term trend, <strong>but not with three</strong>. </span><span class="reading-block">Skewness and kurtosis carry a little information on their own, yet their <strong>gain on top of the centroid and spread is not established</strong> with ${n} seasons, and a single track carries only a <strong>weak ENSO signal (AUC ${auc})</strong>. These results mainly describe where storms form and travel.</span>`,

    mMethodsList: '<li>ACE = sum of squared wind speeds at tropical-stage fixes ≥ 34 kt ÷ 10⁴.</li><li>US landfall: a fix with <code>LANDFALL = 0</code> and ≥ 34 kt inside the contiguous US polygon.</li><li>Significance: permutation tests by season (4,000 shuffles, fixed seed), so storms from the same year are never treated as independent. p-values are Monte Carlo estimates and can differ in the last digit from the Python scripts.</li><li>Track types: arc-length resampling to 16 points, then one K-Means model with K = 4 (highest silhouette for K = 3–7: <span class="mono" id="sil"></span>).</li><li>Moments: computed from the latitude and longitude of 6-hourly fixes; storms with fewer than 4 fixes are skipped.</li>',

function moments(x, y) {
  const n = x.length, mx = d3.mean(x), my = d3.mean(y);
  let sxx = 0, syy = 0, sxy = 0, x3 = 0, y3 = 0, x4 = 0, y4 = 0;
  for (let i = 0; i < n; i++) { const a = x[i] - mx, b = y[i] - my; sxx += a * a; syy += b * b; sxy += a * b; x3 += a ** 3; y3 += b ** 3; x4 += a ** 4; y4 += b ** 4; }
  const m2x = sxx / n, m2y = syy / n;
  const sk = (m3, m2) => m2 > 0 ? (m3 / n) / m2 ** 1.5 : NaN, ku = (m4, m2) => m2 > 0 ? (m4 / n) / m2 ** 2 - 3 : NaN;
  const r = [mx, my, sxx / (n - 1), syy / (n - 1), sxy / (n - 1), sk(x3, m2x), sk(y3, m2y), ku(x4, m2x), ku(y4, m2y)];

}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function permFn(f, A, B, N = 4000) {
  const obs = f(B) - f(A); if (!isFinite(obs) || !A.length || !B.length) return NaN;
  const r = rng(42), arr = A.concat(B); let hit = 0;
  for (let k = 0; k < N; k++) {
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
    if (Math.abs(f(arr.slice(A.length)) - f(arr.slice(0, A.length))) >= Math.abs(obs) - 1e-12) hit++;
  }
  return (hit + 1) / (N + 1);

// =================== STEP 4: TYPE MIX vs WITHIN TYPE ===================
const tsMap = makeMap(document.getElementById('typeShiftMap'));
function splitShift(storms, v, ph = s => s.p) {

  let mix = 0, within = 0;
  for (let k = 0; k < 4; k++) {
    const a = nino.filter(s => s.k === k), b = nina.filter(s => s.k === k); if (!a.length || !b.length) continue;
    const pn = a.length / nino.length, pl = b.length / nina.length, mn = m(a, v), ml = m(b, v);
    mix += (pn - pl) * (mn + ml) / 2; within += (pn + pl) / 2 * (mn - ml);
  }
  return [tot, mix, within];
}
const shiftCache = new Map();
function renderTypeShift() {

      c[p] = [0, 1, 2, 3, 4].map(j => d3.mean(l, s => s.mo[j])); const [x, y] = M.proj([c[p][0], c[p][1]]);
      covEllipse(ctx, x, y, c[p][2], c[p][3], c[p][4], k, 1); ctx.strokeStyle = d3.color(C[p]).copy({ opacity: .45 }) + ''; ctx.lineWidth = 1; ctx.stroke(); });
    if (!c.nina || !c.nino) continue;
    const [x0, y0] = M.proj([c.nina[0], c.nina[1]]), [x1, y1] = M.proj([c.nino[0], c.nino[1]]), a = Math.atan2(y1 - y0, x1 - x0);
    ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    dot(ctx, x0, y0, 5, C.nina, true); dot(ctx, x1, y1, 5, C.nino, true);
    ctx.font = '600 12px -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif'; ctx.fillStyle = C.ink; ctx.strokeStyle = C.halo; ctx.lineWidth = 3;
    const below = t === 0 || t === 3, lx = (x0 + x1) / 2, ly = below ? Math.max(y0, y1) + 24 : Math.min(y0, y1) - 26;
    ctx.textAlign = 'center'; ctx.strokeText(TYPES[t].name, lx, ly); ctx.fillText(TYPES[t].name, lx, ly);
    ctx.font = '500 11.5px -apple-system, "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif'; const s2 = tx('dNorth', fmt1(c.nino[1] - c.nina[1]));
    ctx.strokeText(s2, lx, ly + 15); ctx.fillText(s2, lx, ly + 15); ctx.textAlign = 'left';
  }
  // Reuse the published result at its reference filters; cache other season-level tests.
  const cacheKey = `${state.y0}:${state.cat}`;
  if (!shiftCache.has(cacheKey)) {
    const obs = {}, pvals = {};
    if (state.y0 === DEC.y0 && state.cat === 0) {
      for (const key of ['lon', 'lat']) {
        const d = DEC.main[key]; obs[key] = [d.total, d.mix, d.within]; pvals[key] = [d.p_total, d.p_mix, d.p_within];
      }
    } else {
      const yrs = [...new Set(list.map(s => s.y))].sort(), labs = yrs.map(y => yearInfo[y].p), r = rng(42), NP = 400;
      const hit = { lon: [0, 0, 0], lat: [0, 0, 0] };
      obs.lon = splitShift(list, s => s.mo[0]); obs.lat = splitShift(list, s => s.mo[1]);
      for (let i = 0; i < NP; i++) {
        const pl = labs.slice(); for (let j = pl.length - 1; j > 0; j--) { const q = Math.floor(r() * (j + 1)); [pl[j], pl[q]] = [pl[q], pl[j]]; }
        const map = new Map(yrs.map((y, j) => [y, pl[j]])), ph = s => map.get(s.y);
        for (const [key, f] of [['lon', s => s.mo[0]], ['lat', s => s.mo[1]]]) { const v = splitShift(list, f, ph); for (let j = 0; j < 3; j++) if (Math.abs(v[j]) >= Math.abs(obs[key][j]) - 1e-12) hit[key][j]++; }

      const yy = y0 + headH + r2 * rowH, v = obs[key][j], sig = ps[j] < 0.05, barY = yy + (narrow ? 26 : 4);
      svg.append('text').attr('x', 0).attr('y', yy + 15).attr('fill', C.ink2).attr('font-size', 12.5).text(name);
      svg.append('rect').attr('x', Math.min(x(0), x(v))).attr('y', barY).attr('width', Math.max(2, Math.abs(x(v) - x(0)))).attr('height', 14).attr('rx', 4).attr('fill', col).attr('opacity', sig ? 1 : 0.35);
      svg.append('text').attr('x', narrow ? W - 2 : Math.max(x(0), x(v)) + 8).attr('text-anchor', narrow ? 'end' : 'start').attr('y', yy + 15).attr('fill', sig ? C.ink : C.muted).attr('font-size', 12).attr('font-weight', sig ? 600 : 400).text(`${v >= 0 ? '+' : '−'}${fmt1(Math.abs(v))}° · ${pTxt(ps[j])}`);
      if (narrow) svg.append('line').attr('x1', x(0)).attr('x2', x(0)).attr('y1', barY - 2).attr('y2', barY + 16).attr('stroke', C.line2);
    });
    if (!narrow) svg.append('line').attr('x1', x(0)).attr('x2', x(0)).attr('y1', y0 + headH - 2).attr('y2', y0 + headH + 2 * rowH).attr('stroke', C.line2);
  });

  const row = (lab, d, cls) => `<tr class="${cls || ''}"><td>${lab}</td><td><b>+${d.lon.mix.toFixed(1)}°</b><span class="sm mut">${pTxt(d.lon.p_mix)}</span></td><td><b class="${d.lat.p_within < 0.05 ? '' : 'mut'}">+${d.lat.within.toFixed(1)}°</b><span class="sm mut">${pTxt(d.lat.p_within)}</span></td></tr>`;
  document.getElementById('robTable').innerHTML = `<table><thead><tr><th>${tx('robK')}</th><th>${tx('robEast')}</th><th>${tx('robNorth')}</th></tr></thead><tbody>` +
    DEC.robust.map(d => row(`K = ${d.K}`, d, d.K === 4 ? 'cur' : '')).join('') + row(tx('robDetr'), DEC.detrended) + '</tbody></table>';
}
